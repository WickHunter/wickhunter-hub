# Wick Hunter hub — nginx location block.
#
# This file is APPENDED to the VPS's existing nginx setup by hand, never by
# the installer touching the live config. Add ONE line inside the existing
# `server { listen 443 ssl; ... }` block (e.g. /etc/nginx/conf.d/liqhunter.conf):
#
#     include /opt/wickhunter-hub/nginx/hub.locations.conf;
#
# then: nginx -t && systemctl reload nginx
#
# The trailing slash on proxy_pass strips the /hub prefix, so the hub itself
# serves clean paths (/api/health, /admin, ...) and never needs to know it is
# mounted under /hub/.
location = /hub { return 308 /hub/; }

# A 2 MiB screenshot expands to roughly 2.7 MiB in the JSON/base64 wire body.
# Keep the larger allowance exact to intake; every other Hub route stays 1 MiB.
location = /hub/api/feedback {
    proxy_pass http://127.0.0.1:8091/api/feedback;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    client_max_body_size 4m;
    access_log off;
}

location /hub/ {
    proxy_pass http://127.0.0.1:8091/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    client_max_body_size 1m;
    # License keys travel in query strings by design (curl-pasteable); the
    # default combined log format would record them, so this location logs
    # nothing. Check-in history in the hub's data/checkins.jsonl covers the
    # "who accessed what" question without ever storing a key.
    access_log off;
}
