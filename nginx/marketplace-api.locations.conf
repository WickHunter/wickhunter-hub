# HUB-02: nginx location blocks for the PRIVATE Marketplace API/worker
# service (app repo, `src/marketplace-hub`) — NOT this Hub's own process.
# Use this instead of `deploy/nginx-marketplace-site.conf` when you already
# maintain the `server { listen 443 ssl; server_name marketplace.example.com; ...}`
# block yourself (a shared per-domain nginx layout) and would rather
# `include` these rules:
#
#     include /opt/wickhunter-hub/nginx/marketplace-api.locations.conf;
#
# then: nginx -t && systemctl reload nginx
#
# `LIQHUNTER_MARKETPLACE_URL`'s validator requires the origin's path to be
# exactly "/" (`exactHttpsOrigin`, this repo's `marketplace-inputs.ts`) — so
# the enclosing server block must serve THIS origin at its root; these
# locations must never be nested under another site's path prefix the way
# `hub.locations.conf` nests this Hub under `/hub/`. If your enclosing block
# already has its own `location /` for something else, these two conflict
# with it — use the standalone `deploy/nginx-marketplace-site.conf` instead.
#
# See that file's header comment for the WHY behind every directive below;
# this is the same content in include form.
access_log off;

location = /api/marketplace/operator/status { return 404; }

location = /api/marketplace/stream {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location / {
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
