# deploy/nginx-marketplace-site.conf
#
# HUB-02: a STANDALONE, TLS-terminating nginx site for the PRIVATE Marketplace
# API/worker service — NOT this repo's own process. `wickhunter-hub` never
# executes a trade; this file exists only so the operator has a reviewed,
# copy-pasteable reverse proxy for the SEPARATE `liqhunter` Marketplace API
# service (`src/marketplace-hub`, app repo), whose public origin is what
# alpha app installs are given as `LIQHUNTER_MARKETPLACE_URL` (see this Hub's
# Marketplace configuration page, group "alpha") and what
# `marketplaceStreamWsUrl()` (app repo, `src/server/marketplace-stream-delivery.ts`)
# derives its WebSocket URL from by swapping the scheme and appending
# `/api/marketplace/stream` — there is no SEPARATE stream host/port to
# configure; it rides this SAME origin.
#
# `LIQHUNTER_MARKETPLACE_URL`'s own validator (`exactHttpsOrigin`, app repo
# `operator-status.ts` and this repo's `marketplace-inputs.ts`) REQUIRES the
# origin's path to be exactly "/" — so this must be its own dedicated
# server_name (its own domain or subdomain), never a location mounted under
# an existing site's path. If you already run a per-domain nginx layout and
# would rather `include` the location rules into a server block you maintain
# yourself, lift the two `location` blocks below verbatim.
#
# Install:
#   cp deploy/nginx-marketplace-site.conf /etc/nginx/sites-available/wickhunter-marketplace.conf
#   # edit server_name, the ssl_certificate paths, and the proxy_pass port
#   # below if the private API is not on its documented default (8099 —
#   # MARKETPLACE_HTTP_PORT, this repo's own marketplace-inputs.ts)
#   ln -s /etc/nginx/sites-available/wickhunter-marketplace.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The private Marketplace API/worker are typically colocated on the SAME box
# as this Hub (`MARKETPLACE_HTTP_HOST` stays loopback — see this Hub's own
# `deploy/wickhunter-hub.env.example`), so `proxy_pass` below targets
# 127.0.0.1. If the private service instead runs on a private network this
# box can reach, change the target — never point it at a public address.
#
# ── X-FORWARDED-FOR: see deploy/nginx-hub-site.conf's header comment; the
# same rule applies here for the same reason. ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name marketplace.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marketplace.example.com;

    ssl_certificate     /etc/letsencrypt/live/marketplace.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wickhunter_marketplace_ssl:10m;
    ssl_session_timeout 1d;

    # HUB-02: "stream tickets and license tokens must never land in access
    # logs". A stream ticket travels only INSIDE the post-upgrade WebSocket
    # `hello` message body (see the app repo's `stream-server.ts` header,
    # "NEVER place license tokens or exchange keys in the upgrade URL") and a
    # follower's licence token travels as the `x-license` request HEADER on
    # `POST /api/marketplace/stream-ticket`, not in the URL — nginx's default
    # combined log format records neither today. This is kept OFF anyway, as
    # defense in depth matching this repo's own public Hub (see
    # `nginx/hub.locations.conf`'s identical rule) and because a future
    # Marketplace route is not something this file can predict.
    access_log off;

    client_max_body_size 1m;

    # The status bridge target this Hub calls over LOOPBACK ONLY
    # (`HUB_MARKETPLACE_STATUS_ORIGIN`, validated by `loopbackOrigin()` in
    # `src/marketplace-status.ts` to refuse anything but 127.0.0.1/::1/
    # localhost) must never ALSO be reachable from the public internet
    # through this proxy — it exists so server-to-server status reads never
    # cross a network boundary at all. Refused here explicitly, ahead of the
    # general location below, rather than left to depend on the private
    # service also enforcing it.
    location = /api/marketplace/operator/status { return 404; }

    # MP-09: the persistent copier/provider stream. WebSocket upgrade, no
    # response buffering (a buffered frame is a DELAYED frame — the entire
    # point of this transport over the polling it replaces), and an idle
    # timeout well above the server's own heartbeat cadence
    # (`STREAM_HEARTBEAT_MS` = 3s in the app repo's `stream-server.ts`) so a
    # healthy, heartbeating connection is never cut, while a truly stalled
    # one is still reclaimed inside a bounded window rather than held open
    # indefinitely.
    location = /api/marketplace/stream {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Everything else on this origin: ticket minting, signal/delivery REST,
    # follower/provider routes. Ordinary HTTP — no upgrade, no special
    # buffering rule needed, but response buffering is still disabled so a
    # delivery-fetch response is never held back waiting to fill a buffer.
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
