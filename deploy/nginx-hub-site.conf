# deploy/nginx-hub-site.conf
#
# A STANDALONE, TLS-terminating nginx site for wickhunter-hub, served at the
# site ROOT (e.g. https://hub.example.com/) — for an operator running the Hub
# on its own domain/VPS rather than mounted under an existing app's /hub/
# path. If you already run nginx for another app on this box and want the Hub
# under /hub/ instead, use `nginx/hub.locations.conf` (included from inside
# your existing `server { listen 443 ssl; ... }` block) — see the README.
#
# Install:
#   cp deploy/nginx-hub-site.conf /etc/nginx/sites-available/wickhunter-hub.conf
#   # edit server_name and the ssl_certificate paths below
#   ln -s /etc/nginx/sites-available/wickhunter-hub.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: obtain a certificate however you normally do (certbot/acme.sh — the
# paths below are placeholders for certbot's default layout).
#
# ── X-FORWARDED-FOR: ALWAYS SET, NEVER APPENDED, AND WHY THAT MATTERS HERE ──
# `proxy_set_header X-Forwarded-For $remote_addr;` OVERWRITES whatever header
# a client sent with nginx's OWN view of the TCP peer that reached it. Never
# `$proxy_add_x_forwarded_for`, which APPENDS to a client-supplied value —
# that would let any caller (or a proxy further upstream) inject an arbitrary
# chain nginx would then forward as if it were fact.
#
# The Hub's own `clientIp()` (src/server.ts) trusts this header ONLY when the
# connection reaching the HUB PROCESS itself comes from 127.0.0.1/::1 — which
# is exactly and only THIS nginx, running on the same box and proxying to
# 127.0.0.1:8091. That trust boundary is what this one directive closes: with
# it, every per-IP rate limit (src/ratelimit.ts) and the optional
# HUB_ADMIN_IP_ALLOWLIST see the real internet client; without it (or with a
# Hub exposed directly, bypassing nginx), they would all see "127.0.0.1" for
# every caller and admit an unlimited flood, or a caller-forged header would
# let an attacker pick which IP the Hub blames a refusal on.
server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2;` (rather than the newer standalone `http2 on;`,
    # nginx 1.25.1+ only) so this loads unmodified on the nginx shipped with
    # current LTS distributions (Ubuntu 22.04/24.04 ship 1.18/1.24).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wickhunter_hub_ssl:10m;
    ssl_session_timeout 1d;

    # License keys, admin tokens and licence-lease bearers travel in URLs and
    # request headers this proxy sees in plaintext (this is where TLS is
    # peeled) — the default combined log format would record every one of
    # them. The upstream Hub already refuses to log a raw req.url for the
    # same reason (see src/server.ts's top-of-file comment); this is the
    # OTHER place they could leak, so it stays off unconditionally here too.
    access_log off;

    # A 2 MiB feedback screenshot expands to roughly 2.7 MiB base64 in the
    # JSON body; every other route stays at nginx's ordinary 1 MiB ceiling.
    location = /api/feedback {
        proxy_pass http://127.0.0.1:8091/api/feedback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        client_max_body_size 4m;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        client_max_body_size 1m;
    }
}
